name: Deploy CFB Apex site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-apex-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Install site dependencies
        run: npm ci
      - name: Verify source snapshot and site
        run: npm run verify
      - name: Check production credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Production was not deployed: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
            exit 1
          fi
      - name: Deploy verified build to CFBAPEX.COM
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.jsonc
      - name: Check production Week 6 snapshot
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const snapshot = JSON.parse(readFileSync('data/cfb-2026/refresh/verified-refresh.json', 'utf8'));
          const response = await fetch('https://cfbapex.com/?release=' + encodeURIComponent(snapshot.retrieved_at));
          assert.equal(response.status, 200);
          const html = (await response.text()).replace(/<!--[\s\S]*?-->/g, '');
          assert.ok(html.includes(snapshot.reference_date), 'Production snapshot date is stale');
          assert.ok(html.includes(snapshot.retrieved_at), 'Production source retrieval timestamp is stale');
          console.log('Production source snapshot verified:', snapshot.retrieved_at);
          JS
